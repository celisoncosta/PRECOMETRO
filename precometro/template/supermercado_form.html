{% extends "menu.html" %}
{% load static %}

{% block titulo %}Cadastrar Supermercado{% endblock %}

{% block body %}

<div class="container">
    <h2>Cadastrar Supermercado</h2>
    <br>
    <form method="POST" action="">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Nome do Supermercado:</label>
            <input type="text" name="nome" class="form-control">
        </div>

        <button type="submit" class="btn btn-success">Salvar</button>
    </form>
</div>

{% endblock %}
